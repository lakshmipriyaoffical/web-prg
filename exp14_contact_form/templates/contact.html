{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}
{% block content %}
<h2>Contact Us</h2>
<form method="post">
  <label>Name</label><input name="name" required>
  <label>Email</label><input type="email" name="email" required>
  <label>Message</label><textarea name="message" rows="5" required></textarea>
  <button>Send</button>
</form>
{% endblock %}
