{% extends "base.html" %}
{% block content %}
<h2>Submitted Messages</h2>
<table><tr><th>ID</th><th>Name</th><th>Email</th><th>Message</th><th>Time</th></tr>
{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.name}}</td><td>{{r.email}}</td><td>{{r.message}}</td><td>{{r.created}}</td></tr>{% endfor %}
</table>
{% endblock %}
