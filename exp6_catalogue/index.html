<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalogue</title>
<style>
  body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px}
  .controls{display:flex;gap:10px;margin-bottom:20px}
  .controls input{flex:1;padding:10px} .controls select{padding:10px}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .product{border:1px solid #ddd;border-radius:8px;padding:14px;background:#fff}
  .product h3{margin:0 0 6px} .cat{color:#6b7280;font-size:13px} .price{font-weight:bold;color:#047857}
</style>
</head>
<body>
<h2>Product Catalogue</h2>
<div class="controls">
  <input id="search" placeholder="Search products...">
  <select id="category"><option value="All">All Categories</option></select>
</div>
<div id="list"></div>
<script>
const products = [
  {name:"Laptop", price:55000, category:"Electronics"},
  {name:"Smartphone", price:22000, category:"Electronics"},
  {name:"Headphones", price:1800, category:"Electronics"},
  {name:"T-Shirt", price:499, category:"Clothing"},
  {name:"Jeans", price:1299, category:"Clothing"},
  {name:"Sneakers", price:2499, category:"Footwear"},
  {name:"Notebook", price:60, category:"Stationery"},
  {name:"Pen Set", price:150, category:"Stationery"},
  {name:"Backpack", price:999, category:"Accessories"}
];
const searchBox = document.getElementById("search");
const catBox = document.getElementById("category");
const list = document.getElementById("list");

[...new Set(products.map(p => p.category))].forEach(c => {
  const o = document.createElement("option"); o.value = o.textContent = c; catBox.appendChild(o);
});

function render() {
  const term = searchBox.value.toLowerCase();
  const cat = catBox.value;
  const result = products.filter(p =>
    p.name.toLowerCase().includes(term) && (cat === "All" || p.category === cat));
  list.innerHTML = result.length
    ? result.map(p => `<div class="product"><h3>${p.name}</h3>
        <div class="cat">${p.category}</div><div class="price">&#8377;${p.price}</div></div>`).join("")
    : "<p>No products found.</p>";
}
searchBox.addEventListener("input", render);
catBox.addEventListener("change", render);
render();
</script>
</body>
</html>
