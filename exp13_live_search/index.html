<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Search</title>
<style>
  body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:0 16px}
  input{width:100%;padding:10px;font-size:16px;box-sizing:border-box}
  .item{display:flex;gap:12px;border-bottom:1px solid #ddd;padding:10px 0}
  .item img{width:70px;height:70px;object-fit:cover}
</style>
</head>
<body>
<h2>Live Product Search</h2>
<input id="q" placeholder="Type to search (e.g. phone, laptop, perfume)" autocomplete="off">
<p id="status"></p>
<div id="results"></div>
<script>
const q = document.getElementById("q");
const results = document.getElementById("results");
const statusEl = document.getElementById("status");
let timer;

q.addEventListener("input", () => {
  clearTimeout(timer);                 // debounce: wait 300ms after typing stops
  timer = setTimeout(search, 300);
});

async function search() {
  const term = q.value.trim();
  if (!term) { results.innerHTML = ""; statusEl.textContent = ""; return; }
  statusEl.textContent = "Searching...";
  try {
    const res = await fetch(`https://dummyjson.com/products/search?q=${encodeURIComponent(term)}&limit=10`);
    const data = await res.json();
    statusEl.textContent = `${data.total} result(s) found`;
    results.innerHTML = data.products.map(p => `
      <div class="item">
        <img src="${p.thumbnail}" alt="">
        <div><b>${p.title}</b><br>$${p.price} | ${p.category}</div>
      </div>`).join("");
  } catch (e) {
    statusEl.textContent = "Error fetching results.";
  }
}
</script>
</body>
</html>
