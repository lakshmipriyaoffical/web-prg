{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit' if rec else 'Add' }} Student</h2>
<form method="post">
  <label>Name</label><input name="name" value="{{ rec.name if rec else '' }}" required>
  <label>Email</label><input type="email" name="email" value="{{ rec.email if rec else '' }}" required>
  <label>Course</label><input name="course" value="{{ rec.course if rec else '' }}" required>
  <button>Save</button>
</form>
{% endblock %}
