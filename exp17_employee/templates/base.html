<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}App{% endblock %}</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:30px auto;padding:0 16px;color:#222}
nav a{margin-right:14px}
input,textarea,select{width:100%;padding:8px;margin:4px 0 12px;box-sizing:border-box}
button,.btn{padding:8px 14px;background:#2563eb;color:#fff;border:0;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block}
.danger{background:#dc2626}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}
.flash{padding:10px;margin:10px 0;border-radius:4px;background:#dcfce7}.flash.error{background:#fee2e2}
</style></head><body>
<nav><a href="/">Employees</a><a href="/add">Add Employee</a></nav><hr>
{% with msgs = get_flashed_messages(with_categories=true) %}{% for cat,m in msgs %}<div class="flash {{cat}}">{{m}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</body></html>
