<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<style>
  body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:900px;margin:20px auto}
  .grid img{width:100%;height:130px;object-fit:cover;border-radius:6px;cursor:pointer;transition:transform .3s,box-shadow .3s}
  .grid img:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .slideshow{max-width:700px;margin:30px auto}
  #slide{width:100%;height:380px;object-fit:cover;border-radius:8px}
  button{padding:9px 18px;margin:8px 4px;border:0;border-radius:4px;background:#2563eb;color:#fff;cursor:pointer}
  #auto.on{background:#16a34a}
</style>
</head>
<body>
<h2>Image Gallery</h2>
<div class="grid" id="grid"></div>
<div class="slideshow">
  <img id="slide" alt="slide">
  <p id="counter"></p>
  <button onclick="prev()">&#10094; Previous</button>
  <button onclick="next()">Next &#10095;</button>
  <button id="auto" onclick="toggleAuto()">Auto-play: Off</button>
</div>
<script>
const images = Array.from({length: 8}, (_, i) => `https://picsum.photos/id/${10 + i * 7}/800/500`);
let current = 0, timer = null;

const grid = document.getElementById("grid");
images.forEach((src, i) => {
  const img = document.createElement("img");
  img.src = src;
  img.onclick = () => { current = i; show(); };   // click thumbnail to open in slideshow
  grid.appendChild(img);
});

function show() {
  document.getElementById("slide").src = images[current];
  document.getElementById("counter").textContent = `Image ${current + 1} of ${images.length}`;
}
function next() { current = (current + 1) % images.length; show(); }
function prev() { current = (current - 1 + images.length) % images.length; show(); }
function toggleAuto() {
  const btn = document.getElementById("auto");
  if (timer) { clearInterval(timer); timer = null; btn.textContent = "Auto-play: Off"; btn.classList.remove("on"); }
  else { timer = setInterval(next, 2500); btn.textContent = "Auto-play: On"; btn.classList.add("on"); }
}
show();
</script>
</body>
</html>
