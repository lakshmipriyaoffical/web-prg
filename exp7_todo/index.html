<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
  body{font-family:Arial,sans-serif;background:#eef2ff;display:flex;justify-content:center;padding:40px}
  .box{background:#fff;padding:24px;border-radius:10px;width:380px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .row{display:flex;gap:8px} .row input{flex:1;padding:9px} button{padding:9px 12px;cursor:pointer}
  ul{list-style:none;padding:0}
  li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
  li span{flex:1;cursor:pointer} li.done span{text-decoration:line-through;color:#9ca3af}
  .del{background:#dc2626;color:#fff;border:0;border-radius:4px}
</style>
</head>
<body>
<div class="box">
  <h2>My Tasks</h2>
  <div class="row"><input id="task" placeholder="Add a new task"><button onclick="addTask()">Add</button></div>
  <ul id="list"></ul>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");   // persists across reloads
const list = document.getElementById("list");
const input = document.getElementById("task");

function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); }

function render() {
  list.innerHTML = "";
  tasks.forEach((t, i) => {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    li.innerHTML = `<input type="checkbox" ${t.done ? "checked" : ""}>
                    <span></span><button class="del">Delete</button>`;
    li.querySelector("span").textContent = t.text;     // textContent avoids HTML injection
    li.querySelector("input").onchange = () => { tasks[i].done = !tasks[i].done; save(); render(); };
    li.querySelector("span").onclick = () => { tasks[i].done = !tasks[i].done; save(); render(); };
    li.querySelector(".del").onclick = () => { tasks.splice(i, 1); save(); render(); };
    list.appendChild(li);
  });
}
function addTask() {
  const text = input.value.trim();
  if (!text) return;
  tasks.push({text, done: false});
  input.value = "";
  save(); render();
}
input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
render();
</script>
</body>
</html>
